<template>
    <lightning-card>
        <div slot="title" class="card-title">
            <span class="emoji-title">📊</span>
            <div class="title-block">
                <span class="title-main">Porcentagem de Atendimento</span>
                <span class="title-sub">Análise por tipo de atendimento</span>
            </div>
            <div class="period-toggle">
                <button class={btnMesClass} onclick={selectMes}>Mês corrente</button>
                <button class={btnAnoClass} onclick={selectAno}>Ano corrente</button>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Carregando..." size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="error-container"><p class="error-msg">{errorMessage}</p></div>
        </template>

        <template lwc:elseif={hasData}>
            <div class="card-body">
                <div class="bar-total-row">
                    <div class="stacked-bar">
                        <template for:each={enrichedData} for:item="item">
                            <div key={item.label} class="bar-segment" style={item.widthStyle} title={item.tooltipText}></div>
                        </template>
                    </div>
                    <div class="total-block">
                        <span class="total-number">{totalChamados}</span>
                        <span class="total-label">chamados</span>
                    </div>
                </div>

                <div class="list-header">
                    <span class="col-name-hdr">Tipo de Atendimento</span>
                    <span class="col-pct-hdr">% do total</span>
                    <span class="col-count-hdr">Chamados</span>
                </div>

                <div class="list-scroll">
                    <template for:each={enrichedData} for:item="item">
                        <div key={item.label} class="list-row clickable" data-tipo={item.label} data-label={item.label} onclick={handleTypeClick}>
                            <div class="col-name">
                                <span class="dot" style={item.dotStyle}></span>
                                <span class="row-name">{item.label}</span>
                            </div>
                            <div class="col-pct">
                                <span class="pct-text">{item.formattedPct}%</span>
                                <div class="mini-bar-track">
                                    <div class="mini-bar-fill" style={item.miniBarStyle}></div>
                                </div>
                            </div>
                            <div class="col-count">
                                <span class="count-badge" style={item.badgeStyle}>{item.count}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="empty-container"><p>Nenhum dado no mês corrente.</p></div>
        </template>
    </lightning-card>

    <!-- Modal -->
    <template lwc:if={modalOpen}>
        <div class="modal-backdrop" onclick={closeModal}>
            <div class="modal-box" onclick={stopPropagation}>
                <div class="modal-header">
                    <span class="modal-title">Chamados → {modalTitle}</span>
                    <button class="modal-close" onclick={closeModal}>✕</button>
                </div>
                <div class="modal-body">
                    <template lwc:if={isLoadingCases}>
                        <div class="modal-loading">
                            <lightning-spinner alternative-text="Carregando..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:elseif={hasModalCases}>
                        <table class="case-table">
                            <thead>
                                <tr>
                                    <th>Chamado</th>
                                    <th>Cidade</th>
                                    <th>Transportadora</th>
                                    <th>Estado</th>
                                    <th>Data de Criação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={modalCases} for:item="c">
                                    <tr key={c.id}>
                                        <td><a data-id={c.id} onclick={navigateToCase} class="case-link">{c.caseNumber}</a></td>
                                        <td>{c.cidade}</td>
                                        <td>{c.transportadora}</td>
                                        <td>{c.estado}</td>
                                        <td>{c.dataAgendada}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template lwc:else>
                        <p class="modal-empty">Nenhum case encontrado.</p>
                    </template>
                </div>
            </div>
        </div>
    </template>
</template>
