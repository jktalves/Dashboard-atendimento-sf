<template>
    <lightning-card>
        <div slot="title" class="card-title">
            <span class="emoji-title">🗺️</span> Entregas por regiões
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Carregando..." size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="error-container"><p class="error-msg">{errorMessage}</p></div>
        </template>

        <template lwc:elseif={hasData}>
            <div class="card-body">
                <div class="stacked-bar">
                    <template for:each={enrichedData} for:item="item">
                        <div key={item.label} class="bar-segment" style={item.widthStyle} title={item.tooltipText}></div>
                    </template>
                </div>

                <div class="list-header">
                    <span class="col-label">Destino</span>
                    <span class="col-etiquetas">Chamados</span>
                </div>

                <template for:each={enrichedData} for:item="item">
                    <div key={item.label} class="list-row clickable" data-uf={item.uf} data-label={item.label} onclick={handleStateClick}>
                        <div class="row-left">
                            <span class="dot" style={item.dotStyle}></span>
                            <span class="row-name">{item.label}</span>
                        </div>
                        <div class="row-right">
                            <span class="row-pct">{item.formattedPct}%</span>
                            <span class="badge">{item.count}</span>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:else>
            <div class="empty-container"><p>Nenhum dado nos últimos 30 dias.</p></div>
        </template>
        <div slot="footer" class="refresh-footer">
            ⏱️ Atualiza em {countdown}
        </div>
    </lightning-card>

    <!-- Modal -->
    <template lwc:if={modalOpen}>
        <div class="modal-backdrop" onclick={closeModal}>
            <div class="modal-box" onclick={stopPropagation}>
                <div class="modal-header">
                    <span class="modal-title">Chamados → {modalTitle}</span>
                    <button class="modal-close" onclick={closeModal}>✕</button>
                </div>
                <div class="modal-body">
                    <template lwc:if={isLoadingCases}>
                        <div class="modal-loading">
                            <lightning-spinner alternative-text="Carregando..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:elseif={hasModalCases}>
                        <table class="case-table">
                            <thead>
                                <tr>
                                    <th>Chamado</th>
                                    <th>Cidade</th>
                                    <th>Transportadora</th>
                                    <th>Data Agendada</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={modalCases} for:item="c">
                                    <tr key={c.id}>
                                        <td><a data-id={c.id} onclick={navigateToCase} class="case-link">{c.caseNumber}</a></td>
                                        <td>{c.cidade}</td>
                                        <td>{c.transportadora}</td>
                                        <td>{c.dataAgendada}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template lwc:else>
                        <p class="modal-empty">Nenhum case encontrado.</p>
                    </template>
                </div>
            </div>
        </div>
    </template>
</template>
